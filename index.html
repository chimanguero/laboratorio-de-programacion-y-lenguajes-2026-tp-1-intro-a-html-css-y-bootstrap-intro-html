<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog Personal</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark bg-primary sticky-top">
        <div class="container">
            <!-- Agrego logo -->
            <a class="navbar-brand fw-bold" href="index.html">
                <img src="assets/img/logo.png" alt="Logo" width="40" height="40" class="me-2"> Mi Blog
            </a>
            <!-- Agrego toggler y nav-items -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTop" aria-controls="navbarTop" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
        <div class="collapse navbar-collapse" id="navbarTop">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">Sobre mí</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contacto</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Hero section -->
    <header class="bg-gradient text-white py-5">
        <div class="container text-center">
            <h1 class="display-4">Bienvenido a Mi Blog</h1>
            <p class="lead">Historias, tecnología y reflexiones</p>
        </div>
    </header>

    <!-- Main: listado de artículos -->
    <main class="py-5">
        <div class="container">
            <h2 class="mb-4">Artículos Recientes</h2>

            <!-- Grid de tarjetas (COMPLETAR: 3+ artículos) -->
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm">
                        <img src="assets/images/article-1.jpg" class="card-img-top" alt="Artículo 1">
                        <div class="card-body">
                            <h5 class="card-title">Primer Artículo</h5>
                            <p class="card-text text-muted">Autor: Tu Nombre</p>
                            <p class="card-text">Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
                            <a href="#" class="btn btn-primary btn-sm">Leer más</a>
                        </div>
                    </div>
                </div>
                <!-- TODO: agregar 2 más -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2026 Mi Blog. Todos los derechos reservados.</p>
            <!-- TODO: agregar redes sociales -->
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
